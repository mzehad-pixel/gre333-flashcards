<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F4B6D6">
<title>GRE 333 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #141416;
    --backdrop: #2B2B30;
    --sheet: #ECEBEE;
    --white: #FFFFFF;
    --ink: #17171A;
    --muted: #5E5E69;
    --hair: #E8E8EC;
    --pink: #F4B6D6;
    --yellow: #F9EE75;
    --glass: rgba(255, 255, 255, .72);
    --latin: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bangla: "Hind Siliguri", "Noto Sans Bengali", "Bangla Sangam MN", "Kohinoor Bangla", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--dark);
    color: var(--ink);
    font-family: var(--latin);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  [lang="bn"] { font-family: var(--bangla); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .38; }
  :focus-visible { outline: 2.5px solid currentColor; outline-offset: 2px; }
  [hidden] { display: none !important; }

  .app {
    display: flex; flex-direction: column;
    width: 100%; height: 100vh; height: 100dvh; min-height: 520px;
    background: var(--dark); overflow: hidden;
  }

  /* Upper sheet: gradient fading into soft grey, rounded where it meets the dark strip */
  .sheet {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 14px;
    border-radius: 0 0 28px 28px;
    background:
      radial-gradient(115% 340px at 0% 0%, var(--pink) 0, rgba(244, 182, 214, 0) 72%),
      radial-gradient(105% 320px at 100% 0%, var(--yellow) 0, rgba(249, 238, 117, 0) 74%),
      var(--sheet);
  }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .brand { margin: 0; white-space: nowrap; font-size: clamp(2rem, 6vh, 3rem); font-weight: 700; letter-spacing: -.05em; line-height: 1; }
  .stats { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding-top: 2px; font-size: .8125rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats span { white-space: nowrap; }
  .stats b { font-weight: 700; }

  /* Controls */
  .controls { display: flex; gap: 8px; }
  .pill {
    height: 40px; padding: 0 12px; border-radius: 12px; white-space: nowrap;
    background: var(--glass); border: 0; font-size: .875rem; font-weight: 500;
  }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  .select-wrap { position: relative; flex: 1 1 0; min-width: 0; }
  .select-wrap::after {
    content: ""; position: absolute; right: 13px; top: 15px; width: 7px; height: 7px;
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transform: rotate(45deg); pointer-events: none;
  }
  .select-wrap select {
    width: 100%; padding-right: 28px; -webkit-appearance: none; appearance: none;
    font-size: 16px; font-weight: 500; text-overflow: ellipsis; cursor: pointer;
  }
  .select-wrap option { color: var(--ink); background: var(--white); }

  /* Dashed segment progress */
  .bar {
    --g: repeating-linear-gradient(90deg, #000 0, #000 calc(100% / var(--seg, 20) - 3px), transparent calc(100% / var(--seg, 20) - 3px), transparent calc(100% / var(--seg, 20)));
    height: 4px; background: rgba(23, 23, 26, .16);
    -webkit-mask-image: var(--g); mask-image: var(--g);
  }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .25s ease; }

  /* Card stack */
  .stage { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 2px; }
  .stack { position: absolute; inset: 0; pointer-events: none; }
  .layer { position: absolute; border-radius: 26px; box-shadow: 0 6px 16px rgba(23, 23, 26, .07); }
  .layer.l2 { inset: 0 22px 34px; transform: rotate(1.6deg); }
  .layer.l1 { inset: 7px 10px 20px; transform: rotate(-1.4deg); }
  .card { position: absolute; inset: 14px 0 0; perspective: 1400px; cursor: pointer; border-radius: 26px; touch-action: pan-y; }
  .inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4, .1, .2, 1);
  }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--white); color: var(--ink); border-radius: 26px;
    box-shadow: 0 12px 30px rgba(23, 23, 26, .13);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    transition: visibility 0s linear .25s;
  }
  .back { transform: rotateY(180deg); visibility: hidden; }
  .card.flipped .back { visibility: visible; }
  .card.flipped .front { visibility: hidden; pointer-events: none; }
  .no-anim, .no-anim .face { transition: none !important; }

  .front { display: flex; flex-direction: column; padding: 16px 18px 16px 20px; background: var(--tint, var(--white)); }
  .labels { display: flex; align-items: center; gap: 12px; min-height: 36px; font-size: .875rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .speak {
    flex: none; display: grid; place-items: center; width: 36px; height: 36px; margin-left: auto; padding: 0;
    background: rgba(255, 255, 255, .7); border: 0; border-radius: 50%; color: var(--ink);
  }
  .speak svg { width: 18px; height: 18px; display: block; }
  .word {
    flex: 1; display: flex; align-items: center; justify-content: center; margin: 0; text-align: center;
    font-weight: 700; letter-spacing: -.045em; color: var(--ink); line-height: 1.05;
    font-size: 4rem; /* fitWord() shrinks this to the card's width */
  }
  .word span { display: inline-block; white-space: nowrap; }
  .hint { text-align: center; font-size: .8125rem; color: var(--muted); }

  .scroll {
    height: 100%; overflow-y: auto; scrollbar-width: thin; padding: 22px 20px 26px; touch-action: pan-y;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .back::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px; pointer-events: none;
    background: linear-gradient(rgba(255, 255, 255, 0), var(--white)); opacity: 0; transition: opacity .15s;
  }
  .back.more::after { opacity: 1; }
  .meaning { margin: 0 0 18px; font-size: clamp(1.5rem, 6vw, 1.875rem); font-weight: 600; line-height: 1.35; color: var(--ink); }
  .in-use { margin: 0 0 10px; font-size: .875rem; font-weight: 500; font-style: italic; color: var(--muted); }
  .sentences { margin: 0; padding: 0; list-style: none; }
  .sentences li { padding: 12px 14px; background: #F5F5F7; border-radius: 14px; }
  .sentences li + li { margin-top: 8px; }
  .en { margin: 0; font-size: 1rem; line-height: 1.45; letter-spacing: -.005em; }
  .en b { font-weight: 700; color: var(--ink); }
  .bn { margin: 4px 0 0; font-size: .9375rem; line-height: 1.55; color: var(--muted); }

  /* Summary and empty panels */
  .panel {
    position: absolute; inset: 14px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px; text-align: center; overflow-y: auto;
    background: var(--white); border-radius: 26px; box-shadow: 0 12px 30px rgba(23, 23, 26, .13);
  }
  .panel h2 { margin: 0 0 4px; font-size: 2rem; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; }
  .panel p { margin: 0; color: var(--muted); font-size: .9375rem; line-height: 1.5; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 20px 0 22px; }
  .tile { padding: 14px 4px; border-radius: 16px; }
  .tile:nth-child(1) { background: #E4E2F7; }
  .tile:nth-child(2) { background: #DAFBD8; }
  .tile:nth-child(3) { background: #FDF8DF; }
  .tile b { display: block; font-size: 1.875rem; line-height: 1.15; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .tile span { font-size: .8125rem; color: var(--muted); }
  .cta { min-height: 48px; padding: 0 30px; border: 0; border-radius: 14px; background: var(--pink); color: var(--ink); font-weight: 600; }
  #empty .cta { margin-top: 18px; }

  /* Mark buttons */
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { min-height: 46px; padding: 0 8px; border: 0; border-radius: 14px; font-size: .9375rem; font-weight: 600; letter-spacing: -.01em; background: var(--white); box-shadow: 0 3px 10px rgba(23, 23, 26, .06); }
  #markKnown { background: var(--pink); }
  #markKnown[aria-pressed="true"] { background: var(--ink); color: var(--white); }
  #markStar[aria-pressed="true"] { background: var(--yellow); }

  /* Dark navigation strip */
  .strip {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    min-height: 48px; padding: 0 8px; color: var(--white);
  }
  .strip button { min-height: 44px; padding: 0 10px; background: none; border: 0; border-radius: 10px; font-size: .875rem; font-weight: 500; }
  .counter { font-size: .8125rem; color: #B7B7C0; font-variant-numeric: tabular-nums; text-align: center; }

  /* Search dock */
  .dock {
    flex: none; position: relative; z-index: 20;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    background: var(--sheet); border-radius: 28px 28px 0 0;
  }
  .field { display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 5px 0 14px; background: var(--white); border-radius: 14px; }
  .field svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
  .field input {
    flex: 1 1 0; min-width: 0; height: 100%; padding: 0; background: none; border: 0; outline: 0;
    font-size: 16px; /* prevents iOS focus zoom */
    -webkit-appearance: none; appearance: none;
  }
  .field input::placeholder { color: var(--muted); }
  .field:focus-within { box-shadow: 0 0 0 2px var(--ink); }
  .field button { flex: none; height: 40px; padding: 0 18px; background: var(--yellow); border: 0; border-radius: 11px; font-size: .875rem; font-weight: 600; }
  .results {
    position: absolute; bottom: calc(100% + 8px); left: 16px; right: 16px;
    max-height: min(52vh, 380px); overflow-y: auto; margin: 0; padding: 6px; list-style: none;
    background: var(--white); color: var(--ink); border-radius: 18px;
    box-shadow: 0 16px 44px rgba(23, 23, 26, .28);
  }
  .results button { display: block; width: 100%; padding: 9px 10px; text-align: left; background: none; border: 0; border-radius: 11px; }
  .results button:hover, .results button.active { background: #F1F1F4; }
  .r-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .r-word { font-weight: 600; letter-spacing: -.01em; }
  .r-meta { flex: none; font-size: .75rem; color: var(--muted); }
  .r-mean { display: block; margin-top: 1px; font-size: .9375rem; line-height: 1.45; color: var(--muted); }
  .no-results { padding: 14px 10px; color: var(--muted); font-size: .9375rem; }

  /* Small phones (iPhone SE size) */
  @media (max-width: 359px) {
    .controls { gap: 6px; }
    .pill { padding: 0 7px; font-size: .8125rem; }
    .select-wrap select { padding-left: 9px; padding-right: 22px; }
    .select-wrap::after { right: 9px; }
    .btn { font-size: .875rem; padding: 0 4px; }
    .stats { font-size: .75rem; }
  }
  @media (max-height: 640px) {
    .sheet { gap: 8px; padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 10px; }
    .btn { min-height: 42px; }
    .strip { min-height: 40px; }
    .strip button { min-height: 40px; }
    .dock { padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    .field { height: 44px; }
    .field button { height: 34px; }
    .stats { flex-direction: row; align-items: center; gap: 10px; padding-top: 0; }
    .top { align-items: center; }
  }

  /* Desktop: the app sits as a phone-shaped panel on a dark backdrop */
  @media (min-width: 600px) {
    body { display: grid; place-items: center; background: var(--backdrop); }
    .app {
      width: 430px; height: min(calc(100vh - 40px), 880px); height: min(calc(100dvh - 40px), 880px);
      border-radius: 38px; box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    }
    .sheet { padding-top: 18px; }
  }

  @media (hover: hover) {
    .pill:not(:disabled):not([aria-pressed="true"]):hover { background: var(--white); }
    .btn:not(:disabled):hover, .cta:hover, .field button:hover { filter: brightness(.97); }
    .strip button:not(:disabled):hover { background: rgba(255, 255, 255, .1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .inner, .face, .bar i { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sheet">
    <header class="top">
      <h1 class="brand">GRE 333</h1>
      <div class="stats" aria-live="polite">
        <span>✓ <b id="knownCount">0</b> Known</span>
        <span>★ <b id="starCount">0</b> Starred</span>
      </div>
    </header>

    <div class="controls">
      <div class="select-wrap">
        <select id="setFilter" class="pill" aria-label="Filter by set"></select>
      </div>
      <button id="shuffle" class="pill" type="button" aria-pressed="false">Shuffle</button>
      <button id="starredOnly" class="pill" type="button" aria-pressed="false">★ Starred only</button>
    </div>

    <div class="bar" id="barWrap"><i id="bar"></i></div>

    <main class="stage">
      <div class="stack" id="stack" aria-hidden="true">
        <div class="layer l2" id="layer2"></div>
        <div class="layer l1" id="layer1"></div>
      </div>

      <div class="card" id="card" role="group" tabindex="0" aria-label="Flashcard. Press Space to flip.">
        <div class="inner" id="inner">
          <div class="face front" id="front">
            <div class="labels">
              <span id="labelWord"></span><span id="labelSet"></span>
              <button class="speak" id="speak" type="button" aria-label="Hear this word">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
              </button>
            </div>
            <h2 class="word" id="word"><span id="wordText"></span></h2>
            <div class="hint">Tap to flip</div>
          </div>
          <div class="face back" id="back">
            <div class="scroll" id="scroll">
              <p class="meaning" id="meaning" lang="bn"></p>
              <p class="in-use">Word in use</p>
              <ul class="sentences" id="sentences"></ul>
            </div>
          </div>
        </div>
      </div>

      <section class="panel" id="summary" hidden>
        <h2>Deck complete</h2>
        <p id="summaryDeck"></p>
        <div class="tiles">
          <div class="tile"><b id="sumSeen">0</b><span>Cards seen</span></div>
          <div class="tile"><b id="sumKnown">0</b><span>Known</span></div>
          <div class="tile"><b id="sumStar">0</b><span>Starred</span></div>
        </div>
        <button class="cta" id="restart" type="button">Restart</button>
      </section>

      <section class="panel" id="empty" hidden>
        <h2>No starred words</h2>
        <p id="emptyText"></p>
        <button class="cta" id="showAll" type="button">Turn off Starred only</button>
      </section>
    </main>

    <div class="row">
      <button class="btn" id="markStar" type="button" aria-pressed="false">★ Practice Again</button>
      <button class="btn" id="markKnown" type="button" aria-pressed="false">✓ I Know This</button>
    </div>
  </div>

  <nav class="strip" aria-label="Card navigation">
    <button id="prev" type="button">‹ Previous</button>
    <div class="counter" id="counter" aria-live="polite"></div>
    <button id="next" type="button">Next ›</button>
  </nav>

  <div class="dock" id="searchBox">
    <ul class="results" id="results" role="listbox" aria-label="Matching words" hidden></ul>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="search" type="search" placeholder="Search words" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             role="combobox" aria-label="Search words" aria-controls="results" aria-expanded="false">
      <button id="find" type="button">Find</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var WORDS = JSON.parse(document.getElementById('gre-data').textContent);
  var BY_N = new Map(WORDS.map(function (w) { return [w.n, w]; }));
  var SETS = Array.from(new Set(WORDS.map(function (w) { return w.set; }))).sort(function (a, b) { return a - b; });
  var MARKS_KEY = 'gre333.marks.v1';
  var POS_KEY = 'gre333.position.v1';

  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Storage (never fatal: private windows can block it) ---------- */
  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* marks last for this visit only */ }
  }

  var savedMarks = load(MARKS_KEY) || {};
  var valid = function (n) { return BY_N.has(n); };
  var known = new Set((Array.isArray(savedMarks.known) ? savedMarks.known : []).filter(valid));
  var starred = new Set((Array.isArray(savedMarks.starred) ? savedMarks.starred : []).filter(valid));
  function saveMarks() {
    save(MARKS_KEY, { known: Array.from(known), starred: Array.from(starred) });
  }

  /* ---------- State ---------- */
  var state = {
    set: 'all',          // 'all' or a set number
    starredOnly: false,
    shuffled: false,
    deck: [],            // the words in the current deck, in study order
    idx: 0,
    flipped: false,
    view: 'card',        // 'card' | 'summary' | 'empty'
    seen: new Set()
  };

  function buildDeck() {
    var deck = WORDS.filter(function (w) {
      return (state.set === 'all' || w.set === state.set) && (!state.starredOnly || starred.has(w.n));
    });
    if (state.shuffled) {
      for (var i = deck.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = deck[i]; deck[i] = deck[j]; deck[j] = t;
      }
    }
    return deck;
  }

  /* Rebuild the deck and start a new pass, optionally landing on a given word. */
  function startDeck(landOnN) {
    state.deck = buildDeck();
    state.seen = new Set();
    var at = landOnN == null ? -1 : state.deck.findIndex(function (w) { return w.n === landOnN; });
    state.idx = at >= 0 ? at : 0;
    state.view = state.deck.length ? 'card' : 'empty';
    showCurrent(0);
  }

  /* ---------- Rendering ---------- */
  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* Bold the target word, including inflected forms such as abate → abating, mollify → mollified. */
  function boldTarget(sentence, word) {
    var lower = word.toLowerCase();
    var stem = lower.length >= 5 && /[ey]$/.test(lower) ? lower.slice(0, -1) : lower;
    return sentence.split(/([A-Za-z]+)/).map(function (part, i) {
      return i % 2 && part.toLowerCase().indexOf(stem) === 0 ? '<b>' + part + '</b>' : esc(part);
    }).join('');
  }

  var PASTELS = ['#DFF8FB', '#E4E2F7', '#DAFBD8', '#FDF8DF', '#FADEDD', '#EEFBDD'];
  function pastel(w) { return PASTELS[w.n % PASTELS.length]; }

  /* Largest size (up to the CSS maximum) at which the word fits on one line. */
  function fitWord() {
    var box = $('word'), text = $('wordText');
    box.style.fontSize = '';
    var overflow = text.offsetWidth / box.clientWidth;
    if (overflow > 1) box.style.fontSize = parseFloat(getComputedStyle(box).fontSize) / overflow * .98 + 'px';
  }

  function renderCard(w) {
    $('labelWord').textContent = 'Word ' + w.n;
    $('labelSet').textContent = 'Set ' + w.set;
    $('wordText').textContent = w.word;
    fitWord();
    $('meaning').textContent = w.meaning_bn;
    $('sentences').innerHTML = w.sentences.map(function (s) {
      return '<li><p class="en">' + boldTarget(s.en, w.word) + '</p><p class="bn" lang="bn">' + esc(s.bn) + '</p></li>';
    }).join('');
    $('scroll').scrollTop = 0;
    /* Each card has its own pastel; the layers behind preview the next two cards. */
    $('front').style.setProperty('--tint', pastel(w));
    [$('layer1'), $('layer2')].forEach(function (layer, i) {
      var upcoming = state.deck[state.idx + i + 1];
      layer.hidden = !upcoming;
      if (upcoming) layer.style.background = pastel(upcoming);
    });
  }

  function setFlipped(flipped, animate) {
    var card = $('card'), inner = $('inner');
    state.flipped = flipped;
    if (animate) {
      card.classList.toggle('flipped', flipped);
    } else {
      inner.classList.add('no-anim');
      card.classList.toggle('flipped', flipped);
      void inner.offsetWidth;
      inner.classList.remove('no-anim');
    }
    updateMoreFade();
  }

  function updateMoreFade() {
    var s = $('scroll');
    $('back').classList.toggle('more', s.scrollHeight - s.clientHeight - s.scrollTop > 4);
  }

  function current() { return state.view === 'card' ? state.deck[state.idx] : null; }

  /* Show the current card or panel. dir: -1/1 slides the new card in, 0 does not. */
  function showCurrent(dir) {
    var w = current();
    if (w) {
      setFlipped(false, false);
      renderCard(w);
      updateMoreFade();
      state.seen.add(w.n);
      save(POS_KEY, { n: w.n, set: state.set, starredOnly: state.starredOnly });
      if (dir && !reduceMotion && $('card').animate) {
        $('card').animate(
          [{ opacity: 0, transform: 'translateX(' + dir * 22 + 'px)' }, { opacity: 1, transform: 'none' }],
          { duration: 170, easing: 'ease-out' }
        );
      }
    }
    render();
  }

  /* Everything that depends on state but not on which card's text is loaded. */
  function render() {
    var view = state.view, w = current(), total = state.deck.length;
    $('card').hidden = view !== 'card';
    $('summary').hidden = view !== 'summary';
    $('empty').hidden = view !== 'empty';
    $('stack').hidden = view !== 'card';
    $('barWrap').style.setProperty('--seg', Math.max(1, Math.min(total, 20)));

    $('knownCount').textContent = known.size;
    $('starCount').textContent = starred.size;

    $('counter').textContent = view === 'card' ? 'Card ' + (state.idx + 1) + ' of ' + total
      : view === 'summary' ? 'Finished ' + total + ' of ' + total
      : 'No cards';
    $('bar').style.width = (view === 'card' ? (state.idx + 1) / total * 100 : view === 'summary' ? 100 : 0) + '%';

    $('prev').disabled = view === 'empty' || (view === 'card' && state.idx === 0);
    $('next').disabled = view !== 'card';
    $('next').textContent = view === 'card' && state.idx === total - 1 ? 'Finish ›' : 'Next ›';

    $('markKnown').disabled = $('markStar').disabled = !w;
    $('markKnown').setAttribute('aria-pressed', String(!!w && known.has(w.n)));
    $('markStar').setAttribute('aria-pressed', String(!!w && starred.has(w.n)));

    $('setFilter').value = String(state.set);
    $('shuffle').setAttribute('aria-pressed', String(state.shuffled));
    $('shuffle').textContent = state.shuffled ? 'Shuffled' : 'Shuffle';
    $('shuffle').disabled = !total;
    $('starredOnly').setAttribute('aria-pressed', String(state.starredOnly));

    if (view === 'summary') {
      var inDeck = function (marks) { return state.deck.filter(function (d) { return marks.has(d.n); }).length; };
      $('sumSeen').textContent = state.seen.size;
      $('sumKnown').textContent = inDeck(known);
      $('sumStar').textContent = inDeck(starred);
      $('summaryDeck').textContent = (state.set === 'all' ? 'All Sets' : 'Set ' + state.set) + (state.starredOnly ? ', starred only' : '');
    }
    if (view === 'empty') {
      $('emptyText').textContent = state.set === 'all'
        ? 'Tap “Practice Again” on a card to add it here.'
        : 'Set ' + state.set + ' has no starred words yet. Tap “Practice Again” on a card to add it here.';
    }
  }

  /* ---------- Actions ---------- */
  function flip() {
    if (state.view === 'card') setFlipped(!state.flipped, true);
  }
  function next() {
    if (state.view !== 'card') return;
    if (state.idx < state.deck.length - 1) { state.idx++; showCurrent(1); }
    else { state.view = 'summary'; render(); }
  }
  function prev() {
    if (state.view === 'summary') { state.view = 'card'; showCurrent(-1); }
    else if (state.view === 'card' && state.idx > 0) { state.idx--; showCurrent(-1); }
  }

  /* Known and Practice Again are opposites, so setting one clears the other. */
  function toggleMark(target, other) {
    var w = current();
    if (!w) return;
    if (target.has(w.n)) target.delete(w.n);
    else { target.add(w.n); other.delete(w.n); }
    saveMarks();
    render();
  }

  function openWord(n) {
    closeSearch();
    var at = state.deck.findIndex(function (w) { return w.n === n; });
    if (at >= 0) {
      state.idx = at;
      state.view = 'card';
      showCurrent(0);
    } else {
      state.set = 'all';
      state.starredOnly = false;
      startDeck(n);
    }
  }

  /* ---------- Search ---------- */
  var activeResult = -1;

  function searchMatches(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    if (/^\d+$/.test(q)) {
      var byNumber = BY_N.get(Number(q));
      return byNumber ? [byNumber] : [];
    }
    var starts = [], contains = [];
    WORDS.forEach(function (w) {
      var at = w.word.toLowerCase().indexOf(q);
      if (at === 0) starts.push(w);
      else if (at > 0) contains.push(w);
    });
    return starts.concat(contains);
  }

  function renderResults() {
    var input = $('search'), list = $('results'), query = input.value;
    activeResult = -1;
    input.removeAttribute('aria-activedescendant');
    if (!query.trim()) { closeResultsList(); return; }
    var matches = searchMatches(query);
    list.innerHTML = matches.length ? matches.map(function (w) {
      return '<li role="presentation"><button type="button" role="option" id="res-' + w.n + '" data-n="' + w.n + '">' +
        '<span class="r-head"><span class="r-word">' + esc(w.word) + '</span>' +
        '<span class="r-meta">Word ' + w.n + ' · Set ' + w.set + '</span></span>' +
        '<span class="r-mean" lang="bn">' + esc(w.meaning_bn) + '</span></button></li>';
    }).join('') : '<li class="no-results" role="presentation">No matching words</li>';
    list.hidden = false;
    list.scrollTop = 0;
    input.setAttribute('aria-expanded', 'true');
  }
  function closeResultsList() {
    $('results').hidden = true;
    $('search').setAttribute('aria-expanded', 'false');
  }
  function closeSearch() {
    $('search').value = '';
    closeResultsList();
    $('search').blur();
  }

  function moveActive(delta) {
    var buttons = $('results').querySelectorAll('button');
    if (!buttons.length) return;
    activeResult = (activeResult + delta + buttons.length) % buttons.length;
    buttons.forEach(function (b, i) { b.classList.toggle('active', i === activeResult); });
    buttons[activeResult].scrollIntoView({ block: 'nearest' });
    $('search').setAttribute('aria-activedescendant', buttons[activeResult].id);
  }

  $('search').addEventListener('input', renderResults);
  $('search').addEventListener('focus', renderResults);
  $('search').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
    else if (e.key === 'Escape') { closeSearch(); }
    else if (e.key === 'Enter') {
      var buttons = $('results').querySelectorAll('button');
      var pick = buttons[activeResult] || buttons[0];
      if (pick) openWord(Number(pick.dataset.n));
    }
  });
  $('find').addEventListener('click', function () {
    var first = $('results').querySelector('button');
    if (first && !$('results').hidden) openWord(Number(first.dataset.n));
    else $('search').focus();
  });
  $('results').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) openWord(Number(b.dataset.n));
  });
  document.addEventListener('click', function (e) {
    if (!$('searchBox').contains(e.target)) closeResultsList();
    /* A clicked button must not keep focus, or Space would press it again instead of flipping. */
    var button = e.target.closest && e.target.closest('button');
    if (button && e.detail > 0) button.blur();
  });

  /* ---------- Controls ---------- */
  $('setFilter').innerHTML = '<option value="all">All Sets</option>' + SETS.map(function (s) {
    return '<option value="' + s + '">Set ' + s + '</option>';
  }).join('');
  $('setFilter').addEventListener('change', function (e) {
    state.set = e.target.value === 'all' ? 'all' : Number(e.target.value);
    state.shuffled = false;   // so "first card" means the set's real first card
    startDeck();
    e.target.blur();
  });
  $('shuffle').addEventListener('click', function () {
    var w = current();
    state.shuffled = !state.shuffled;
    startDeck(state.shuffled || !w ? null : w.n);   // un-shuffling stays on the current word
  });
  $('starredOnly').addEventListener('click', function () {
    state.starredOnly = !state.starredOnly;
    startDeck();
  });
  $('showAll').addEventListener('click', function () {
    state.starredOnly = false;
    startDeck();
  });
  $('restart').addEventListener('click', function () { startDeck(); });
  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  $('markKnown').addEventListener('click', function () { toggleMark(known, starred); });
  $('markStar').addEventListener('click', function () { toggleMark(starred, known); });
  $('scroll').addEventListener('scroll', updateMoreFade, { passive: true });
  window.addEventListener('resize', function () { updateMoreFade(); if (current()) fitWord(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (current()) fitWord(); });

  /* ---------- Card: tap to flip, swipe to move ---------- */
  var touch = null, swipedAt = 0;
  $('card').addEventListener('touchstart', function (e) {
    touch = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
  }, { passive: true });
  $('card').addEventListener('touchend', function (e) {
    if (!touch) return;
    var dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 2) {
      swipedAt = Date.now();
      if (dx < 0) next(); else prev();
    }
  }, { passive: true });
  $('card').addEventListener('click', function (e) {
    if (e.target.closest('#speak')) return;
    if (Date.now() - swipedAt < 400) return;
    var selection = window.getSelection && String(window.getSelection());
    if (selection) return;   // dragging to select text is not a tap
    flip();
  });

  /* ---------- Speak the word with the browser's built-in voice ---------- */
  if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
    $('speak').addEventListener('click', function () {
      var w = current();
      if (!w) return;
      var utterance = new SpeechSynthesisUtterance(w.word);
      utterance.lang = 'en-US';
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    });
  } else {
    $('speak').hidden = true;
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t.matches('input, select, textarea')) return;
    var onButton = t.matches('button');
    if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if ((e.key === ' ' || e.code === 'Space') && !onButton) {
      e.preventDefault();
      if (!e.repeat) flip();
    }
    else if (e.key === 'Enter' && t === $('card')) { e.preventDefault(); flip(); }
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && state.flipped && state.view === 'card') {
      e.preventDefault();
      $('scroll').scrollBy({ top: e.key === 'ArrowDown' ? 70 : -70 });
    }
  });

  /* ---------- Start where the learner left off ---------- */
  var pos = load(POS_KEY) || {};
  if (SETS.indexOf(pos.set) >= 0) state.set = pos.set;
  state.starredOnly = pos.starredOnly === true;
  startDeck(valid(pos.n) ? pos.n : null);
})();
</script>
</body>
</html>
